<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>TrustPass card — A-F mapping</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: grid;
    place-items: center;
    font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
    /* Scene canvas — bright aqua bloom upper-left, sinking to deep teal. */
    background: radial-gradient(
      ellipse 130% 110% at 40% 25%,
      #a3f2f4 0%,
      #60cdda 35%,
      #2f9cb2 62%,
      #1d7d97 82%,
      #1a6d86 100%
    );
  }
  .card {
    position: relative;
    width: 860px;
    height: 542px;
    border-radius: 28px;
    overflow: hidden;
    background: linear-gradient(112deg, #6fe0e6 0%, #3db8c9 36%, #2090a7 66%, #125f76 100%);
    box-shadow:
      0 48px 96px -24px rgba(4, 28, 38, 0.6),
      0 12px 32px -8px rgba(4, 28, 38, 0.4),
      inset 0 1px 0 rgba(255, 255, 255, 0.5);
  }
  /* Faint topographic waves, echoing the reference design. */
  .topo { position: absolute; inset: 0; opacity: 0.14; }
  .inner {
    position: relative;
    height: 100%;
    padding: 44px 46px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    color: #fff;
  }
  /* Row 1 — brand + contactless */
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo-chip {
    width: 58px; height: 58px;
    border-radius: 16px;
    background: #0b3342;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 4px 12px rgba(3, 20, 28, 0.35);
    overflow: hidden;
    display: grid;
    place-items: center;
  }
  .logo-chip img { width: 100px; height: 100px; }
  .wordmark {
    font-size: 30px; font-weight: 800; letter-spacing: -0.02em;
    text-shadow: 0 1px 2px rgba(4, 30, 40, 0.35);
  }
  .contactless { display: flex; align-items: center; }
  /* Row 2 — chip + number */
  .chip {
    width: 94px; height: 66px;
    border-radius: 12px;
    background: linear-gradient(150deg, #f2ecd3 0%, #cdc19a 45%, #978c6b 100%);
    box-shadow: inset 0 1px 2px rgba(255,255,255,0.75), 0 3px 8px rgba(3, 20, 28, 0.35);
    background-image:
      linear-gradient(150deg, #f2ecd3 0%, #cdc19a 45%, #978c6b 100%),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.28) 0 2px, transparent 2px 16px),
      repeating-linear-gradient(0deg, rgba(0,0,0,0.28) 0 2px, transparent 2px 16px);
    background-blend-mode: normal, multiply, multiply;
  }
  .number {
    margin-top: 30px;
    font-family: 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
    font-size: 36px; font-weight: 500;
    letter-spacing: 0.14em;
    text-shadow: 0 1px 3px rgba(4, 30, 40, 0.4);
  }
  /* Row 3 — meta left, mapping right */
  .meta-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 30px; }
  .meta-left { display: flex; flex-direction: column; gap: 20px; }
  .exp-cvv { display: flex; gap: 44px; }
  .meta-left .label {
    font-size: 14px; font-weight: 700;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: rgba(255,255,255,0.68);
    text-shadow: 0 1px 2px rgba(4, 30, 40, 0.3);
  }
  .meta-left .value {
    margin-top: 6px;
    font-size: 21px; font-weight: 600;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 2px rgba(4, 30, 40, 0.35);
  }
  .holder {
    font-size: 22px; font-weight: 800; letter-spacing: 0.07em;
    text-shadow: 0 1px 2px rgba(4, 30, 40, 0.35);
  }
  /* Mapping box — the A-F grid */
  .mapbox {
    flex-shrink: 0;
    border: 2px solid rgba(255, 255, 255, 0.6);
    border-radius: 14px;
    background: rgba(5, 32, 44, 0.34);
    padding: 15px 22px 13px;
    backdrop-filter: blur(4px);
  }
  .mapgrid {
    display: grid;
    grid-template-columns: repeat(2, auto);
    column-gap: 34px; row-gap: 7px;
    font-family: 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
    font-size: 20px; font-weight: 600; letter-spacing: 0.06em;
  }
  .mapgrid span { white-space: nowrap; }
  .maplabel {
    margin-top: 9px;
    text-align: center;
    font-size: 12px; font-weight: 700;
    letter-spacing: 0.34em; text-transform: uppercase;
    color: rgba(255, 255, 255, 0.74);
  }
  /* Shield between CVV and the mapping box, in light cyan. */
  .mid-shield { align-self: center; margin-bottom: 6px; }
</style>
</head>
